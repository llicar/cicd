name: "CI (Integração Continua): Main Workflow"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Installation
        run: npm install

      - name: Run Linter
        run: npm run lint
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Installation
        run: npm run install
      - name: Run preview Deployment
        run: npm run deploy:preview
